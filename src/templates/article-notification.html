<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{subject}}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #f4f4f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        color: #333333;
      }

      .wrapper {
        max-width: 620px;
        margin: 40px auto;
        background-color: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      /* Header */
      .header {
        background-color: #1a1a2e;
        padding: 32px 40px;
        text-align: center;
      }

      .header .logo {
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .header .tagline {
        margin-top: 4px;
        font-size: 12px;
        color: #a0a0b8;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* Badge */
      .badge-wrap {
        background-color: #f4f4f7;
        padding: 16px 40px 0;
      }

      .badge {
        display: inline-block;
        background-color: #e8f0fe;
        color: #1a56db;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 4px 12px;
        border-radius: 20px;
      }

      /* Body */
      .body {
        padding: 24px 40px 40px;
      }

      .article-title {
        font-size: 24px;
        font-weight: 700;
        color: #1a1a2e;
        line-height: 1.3;
        margin-bottom: 16px;
      }

      .meta {
        display: flex;
        gap: 16px;
        margin-bottom: 20px;
      }

      .meta-item {
        font-size: 12px;
        color: #888888;
      }

      .meta-item span {
        font-weight: 600;
        color: #555555;
      }

      .divider {
        height: 1px;
        background-color: #eeeeee;
        margin: 20px 0;
      }

      .excerpt {
        font-size: 15px;
        line-height: 1.7;
        color: #555555;
      }

      .cta-wrap {
        margin-top: 32px;
        text-align: center;
      }

      .cta-button {
        display: inline-block;
        background-color: #1a1a2e;
        color: #ffffff !important;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        padding: 14px 32px;
        border-radius: 6px;
        letter-spacing: 0.5px;
      }

      /* Categories */
      .categories {
        margin-top: 28px;
      }

      .categories-label {
        font-size: 11px;
        font-weight: 600;
        color: #888888;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .category-tag {
        display: inline-block;
        font-size: 12px;
        font-weight: 500;
        padding: 3px 10px;
        border-radius: 4px;
        margin-right: 6px;
        margin-bottom: 4px;
        background-color: {{categoryColor}};
        color: #ffffff;
      }

      /* Footer */
      .footer {
        background-color: #f4f4f7;
        padding: 24px 40px;
        text-align: center;
        border-top: 1px solid #eeeeee;
      }

      .footer p {
        font-size: 12px;
        color: #aaaaaa;
        line-height: 1.6;
      }

      .footer a {
        color: #1a56db;
        text-decoration: none;
      }

      .network-name {
        font-weight: 600;
        color: #555555;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <!-- Header -->
      <div class="header">
        <div class="logo">Editorial</div>
        <div class="tagline">{{networkName}}</div>
      </div>

      <!-- Badge -->
      <div class="badge-wrap">
        <span class="badge">Nouvel article</span>
      </div>

      <!-- Body -->
      <div class="body">
        <h1 class="article-title">{{title}}</h1>

        <div class="meta">
          <div class="meta-item">Par <span>{{author}}</span></div>
          <div class="meta-item">Publié le <span>{{publishedAt}}</span></div>
        </div>

        <div class="divider"></div>

        <p class="excerpt">{{excerpt}}</p>

        <div class="cta-wrap">
          <a href="{{articleUrl}}" class="cta-button">Lire l'article complet</a>
        </div>

        {{#if categories}}
        <div class="categories">
          <div class="categories-label">Catégories</div>
          {{categories}}
        </div>
        {{/if}}
      </div>

      <!-- Footer -->
      <div class="footer">
        <p>
          Vous recevez cet email car vous êtes abonné au réseau
          <span class="network-name">{{networkName}}</span>.<br />
          <a href="#">Se désabonner</a>
        </p>
      </div>
    </div>
  </body>
</html>
